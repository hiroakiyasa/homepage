name: Apply direct hubs and Quest promotion

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-direct-hubs-promo-20260916.yml'

permissions:
  contents: write

concurrency:
  group: direct-hubs-promo-20260916
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve the currently published site
        run: |
          if git ls-remote --exit-code --heads origin backup/pre-direct-hubs-promo-20260916 >/dev/null 2>&1; then
            echo 'Backup branch already exists.'
          else
            git push origin HEAD^:refs/heads/backup/pre-direct-hubs-promo-20260916
          fi
      - name: Restore the patch source
        run: |
          mkdir -p assets/css
          echo '' | base64 -d | gzip -d > /tmp/apply_route_promo.py
          echo '' | base64 -d | gzip -d > assets/css/quest-promo.css
          python -m pip install beautifulsoup4==4.13.4 pillow==11.3.0 playwright==1.55.0
      - name: Apply the requested navigation and promotional design
        run: python /tmp/apply_route_promo.py
      - name: Install browser and Japanese fonts
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Validate the complete committed site
        run: python scripts/site-redesign/validate.py
      - name: Commit and push the verified result
        run: |
          rm -f .github/workflows/apply-direct-hubs-promo-20260916.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: open travel DIY and maintenance directly and restore promotional Quest design'
          git push origin HEAD:master
