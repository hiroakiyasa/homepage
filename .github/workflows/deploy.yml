name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
      - name: Verify release files
        run: |
          test -f apps.html
          test -f index.html
          test -f quest/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,time,urllib.request
          error=None
          for attempt in range(12):
              try:
                  headers={'User-Agent':'TrailFusion-Release-Check/2.3','Cache-Control':'no-cache'}
                  with urllib.request.urlopen(urllib.request.Request('https://trailfusionai.com/apps.html?release='+os.environ['RELEASE_SHA'],headers=headers),timeout=30) as r:
                      if r.status!=200: raise RuntimeError('apps.html HTTP '+str(r.status))
                  with urllib.request.urlopen(urllib.request.Request('https://trailfusionai.com/?release='+os.environ['RELEASE_SHA'],headers=headers),timeout=20) as r:
                      home=r.read().decode('utf-8')
                  if 'href="/apps.html"' not in home: raise RuntimeError('homepage apps routing not live yet')
                  print('Live release verified')
                  error=None
                  break
              except Exception as exc:
                  error=exc
                  if attempt<11: time.sleep(10)
          if error: raise error
          PY
