name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
      - name: Verify intended catalog routing before deploy
        run: |
          python - <<'PY'
          from pathlib import Path
          index=Path('index.html').read_text()
          apps=Path('apps.html').read_text()
          quest=Path('quest/index.html').read_text()
          assert 'にほんごクエスト' in apps, 'restored ten-app catalog is missing Nihongo Quest'
          assert len(apps) > 3000000, 'restored legacy apps showcase is unexpectedly small'
          assert 'href="/apps.html"' in index, 'homepage does not link to apps catalog'
          assert 'url=/apps.html' in quest, 'retired Quest hub does not redirect to apps catalog'
          print('Catalog routing checks passed')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public apps catalog and routing
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,time,urllib.request
          base='https://trailfusionai.com'
          error=None
          for attempt in range(12):
              try:
                  headers={'User-Agent':'TrailFusion-Release-Check/2.1','Cache-Control':'no-cache'}
                  req=urllib.request.Request(base+'/apps.html?release='+os.environ['RELEASE_SHA'],headers=headers)
                  with urllib.request.urlopen(req,timeout=30) as r:
                      apps=r.read().decode('utf-8')
                  if r.status!=200 or 'にほんごクエスト' not in apps:
                      raise RuntimeError('restored ten-app catalog not served yet')
                  req=urllib.request.Request(base+'/?release='+os.environ['RELEASE_SHA'],headers=headers)
                  with urllib.request.urlopen(req,timeout=20) as r:
                      home=r.read().decode('utf-8')
                  if 'href="/apps.html"' not in home:
                      raise RuntimeError('homepage apps routing not served yet')
                  req=urllib.request.Request(base+'/quest/?release='+os.environ['RELEASE_SHA'],headers=headers)
                  with urllib.request.urlopen(req,timeout=20) as r:
                      final_url=r.geturl()
                  if '/apps.html' not in final_url:
                      raise RuntimeError('retired Quest hub is not redirecting to apps catalog')
                  print('Live verification passed:', final_url)
                  error=None
                  break
              except Exception as exc:
                  error=exc
                  if attempt<11: time.sleep(10)
          if error: raise error
          PY
