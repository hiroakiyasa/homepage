name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      # The committed HTML is the release. These checks read it and never rewrite it.
      - name: Check brand pages, links, sitemap and retired locales
        run: python scripts/brand/check-static.py

      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the live top page and apps catalog
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, time, urllib.request
          checks = {'/': ['毎日に、', 'href="/quest/"', 'href="/garage/"'], '/apps.html': ['TrailFusion の', 'data-cat="heart"'], '/en/': ['Small adventures']}
          error = None
          for attempt in range(18):
              try:
                  for path, markers in checks.items():
                      req = urllib.request.Request('https://trailfusionai.com' + path + '?release=' + os.environ['RELEASE_SHA'],
                                                   headers={'User-Agent': 'TrailFusion-Release-Check/5.0', 'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(req, timeout=30) as res:
                          html = res.read().decode('utf-8')
                      missing = [m for m in markers if m not in html]
                      if res.status != 200 or missing:
                          raise RuntimeError(f'{path}: status {res.status}, missing {missing}')
                  print('Live brand pages verified')
                  error = None
                  break
              except Exception as exc:
                  error = exc
                  time.sleep(10)
          if error:
              raise error
          PY
