name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
      - name: Verify direct legacy apps page
        run: |
          python - <<'PY'
          from pathlib import Path
          apps=Path('apps.html').read_text()
          assert '<iframe' not in apps, 'apps page must not use iframe'
          assert 'この机から' in apps, 'legacy hero is missing'
          assert '10のアプリ' in apps, 'legacy hero app count is missing'
          print('Direct legacy apps hero verified')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public hero is persistent
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,time,urllib.request
          error=None
          for attempt in range(12):
              try:
                  req=urllib.request.Request('https://trailfusionai.com/apps.html?release='+os.environ['RELEASE_SHA'],headers={'User-Agent':'TrailFusion-Release-Check/3.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=30) as r: html=r.read().decode('utf-8')
                  if r.status!=200: raise RuntimeError('apps HTTP '+str(r.status))
                  if '<iframe' in html: raise RuntimeError('old iframe wrapper still live')
                  if 'この机から' not in html or '10のアプリ' not in html: raise RuntimeError('legacy hero not live yet')
                  print('Live apps hero verified')
                  error=None;break
              except Exception as exc:
                  error=exc
                  if attempt<11: time.sleep(10)
          if error: raise error
          PY
