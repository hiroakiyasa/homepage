name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
      - name: Verify direct legacy apps page
        run: |
          python - <<'PY'
          from pathlib import Path
          apps=Path('apps.html').read_text()
          assert '<iframe' not in apps, 'apps page must not use iframe'
          assert 'この机から' in apps, 'legacy hero is missing'
          assert '10のアプリ' in apps, 'legacy hero app count is missing'
          print('Direct legacy apps hero verified')
          PY
      - name: Apply mobile catalog layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps.html')
          html=p.read_text()
          css=r'''<style id="apps-mobile-layout-fix">
          /* Keep the Car Concierge screenshot trio at the source image aspect ratio.
             apps.html uses .fshots; width is responsive, so height must remain automatic. */
          .fshots{align-items:flex-start!important;height:auto!important}
          .fshots img{height:auto!important;object-fit:contain!important;object-position:top center!important}
          @media(max-width:767px){
            html,body{overflow-x:hidden!important}
            .app-section-v2{padding-top:2.5rem!important;padding-bottom:2.5rem!important;min-height:0!important;height:auto!important}
            .app-section-v2 .container{padding-left:20px!important;padding-right:20px!important;max-width:100%!important}
            .app-section-v2 .grid{display:flex!important;flex-direction:column!important;gap:1.5rem!important}
            .app-section-v2 .grid>*{width:100%!important;max-width:100%!important;min-width:0!important;grid-column:auto!important}
            .app-section-v2 .flex{min-width:0!important}
            .app-section-v2 img,.app-section-v2 video{max-width:100%!important;height:auto!important}
            .app-section-v2 h2,.app-section-v2 h3,.app-section-v2 p{max-width:100%!important;overflow-wrap:anywhere}
            .app-section-v2 h2{font-size:clamp(1.75rem,8vw,2.35rem)!important;line-height:1.25!important}
            .app-section-v2 p{font-size:1rem!important;line-height:1.8!important}
            .app-section-v2 .btn-chunky{max-width:100%!important;white-space:normal!important;text-align:center!important;justify-content:center!important}
          }
          @media(max-width:420px){.app-section-v2 .container{padding-left:18px!important;padding-right:18px!important}.app-section-v2{padding-top:2.1rem!important;padding-bottom:2.1rem!important}}
          </style>'''
          assert '</head>' in html
          html=html.replace('</head>',css+'</head>',1)
          p.write_text(html)
          rendered=p.read_text()
          assert 'apps-mobile-layout-fix' in rendered
          assert '.fshots img{height:auto!important' in rendered
          print('Catalog layout and screenshot aspect ratio fix injected')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public apps release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,time,urllib.request
          error=None
          for attempt in range(18):
              try:
                  req=urllib.request.Request('https://trailfusionai.com/apps.html?release='+os.environ['RELEASE_SHA'],headers={'User-Agent':'TrailFusion-Release-Check/3.1','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=30) as r: html=r.read().decode('utf-8')
                  if r.status!=200: raise RuntimeError('apps HTTP '+str(r.status))
                  if '<iframe' in html: raise RuntimeError('old iframe wrapper still live')
                  if 'この机から' not in html or '10のアプリ' not in html: raise RuntimeError('legacy hero not live')
                  if 'apps-mobile-layout-fix' not in html: raise RuntimeError('mobile layout fix not live')
                  if '.fshots img{height:auto!important' not in html: raise RuntimeError('screenshot aspect ratio fix not live')
                  print('Live apps hero, mobile layout, and screenshot aspect ratio verified')
                  error=None;break
              except Exception as exc:
                  error=exc
                  if attempt<17: time.sleep(10)
          if error: raise error
          PY
