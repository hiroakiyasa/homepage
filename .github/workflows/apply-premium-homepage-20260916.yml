name: Apply premium homepage assets

on:
  push:
    branches: [master]
    paths:
      - '.site-update/premium-homepage/**'
      - '.github/workflows/apply-premium-homepage-20260916.yml'

permissions:
  contents: write

concurrency:
  group: premium-homepage-20260916
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Rebuild generated campaign image sprite
        run: |
          if [ ! -f .site-update/premium-homepage/chunk-00 ]; then
            echo 'Premium homepage assets are already installed.'
            exit 0
          fi
          mkdir -p assets/hero
          cat .site-update/premium-homepage/chunk-* > /tmp/trailfusion-home-sprite.b64
          base64 --decode /tmp/trailfusion-home-sprite.b64 > assets/hero/trailfusion-home-sprite.avif
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/hero/trailfusion-home-sprite.avif')
          data = p.read_bytes()
          assert b'ftypavif' in data[:64], 'Generated file is not AVIF'
          assert p.stat().st_size > 15000, 'Generated image is unexpectedly small'
          print(f'AVIF sprite verified: {p.stat().st_size:,} bytes')
          PY
          grep -q 'tf-premium-hero' index.html
          grep -q 'FAQPage' index.html
          grep -q '/travel/story.html' index.html
          grep -q '/camping.html' index.html
          grep -q '/maintenance.html' index.html
          rm -rf .site-update/premium-homepage

      - name: Commit and push verified premium homepage assets
        run: |
          if [ ! -f assets/hero/trailfusion-home-sprite.avif ]; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hero/trailfusion-home-sprite.avif
          git add -u .site-update/premium-homepage
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: publish generated campaign visuals for premium homepage'
          git push origin HEAD:master
