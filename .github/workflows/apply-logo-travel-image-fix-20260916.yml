name: Apply original logo and travel screenshot fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-logo-travel-image-fix-20260916.yml'

permissions:
  contents: write

concurrency:
  group: original-logo-travel-screenshot-fix-20260916
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore the original logo and fix portrait previews
        env:
          HOTFIX_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import os
          import re
          import subprocess

          baseline = 'b8c922f00f90f1e443b02253dd78d5f60b2de53d'
          source = subprocess.check_output(['git', 'show', f'{baseline}:index.html'], text=True)
          match = re.search(
              r'<img src="data:image/webp;base64,([^"]+)" alt="TrailFusion AI" class="lockup">',
              source,
          )
          if not match:
              raise SystemExit('Original TrailFusion lockup was not found in the preserved page.')

          logo_path = Path('assets/icons/trailfusion-lockup.webp')
          logo_path.parent.mkdir(parents=True, exist_ok=True)
          logo_path.write_bytes(base64.b64decode(match.group(1)))

          css_path = Path('assets/css/site-v2.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '2026-09-16: restore the original TrailFusion lockup'
          if marker not in css:
              css += base64.b64decode(os.environ['HOTFIX_B64']).decode('utf-8')
              css_path.write_text(css, encoding='utf-8')

          logo = logo_path.read_bytes()
          assert logo[:4] == b'RIFF' and logo[8:12] == b'WEBP'
          updated = css_path.read_text(encoding='utf-8')
          assert marker in updated
          assert "trailfusion-lockup.webp" in updated
          assert ".tf-legacy .why-pic figure img" in updated
          print(f'Original logo restored: {len(logo):,} bytes')
          PY

      - name: Commit and push the verified fix
        run: |
          git rm --ignore-unmatch .github/workflows/apply-logo-travel-image-fix-20260916.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site-v2.css assets/icons/trailfusion-lockup.webp
          git commit -m 'fix: restore original TrailFusion logo and resize travel app previews'
          git push origin HEAD:master
