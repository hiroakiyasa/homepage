name: Inspect Apps Layout

on:
  push:
    paths:
      - '.github/workflows/inspect-apps-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect archived app showcase
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          def clean(value):
              value = re.sub(r'(src=[\"\'])data:image/[^;]+;base64,[^\"\']+([\"\'])', r'\1[DATA_URI]\2', value, flags=re.I)
              return re.sub(r'\s+', ' ', value).strip()

          def inspect(path):
              text = Path(path).read_text(encoding='utf-8')
              print(f'\n===== {path} size={len(text)} =====')
              for term in ('fshots', 'lshots', 'lead-app', 'この物語から生まれた', '車旅コンシェルジュ'):
                  positions = [m.start() for m in re.finditer(re.escape(term), text, re.I)]
                  print(f'{term}: count={len(positions)} first={positions[:8]}')
                  for pos in positions[:2]:
                      print(clean(text[max(0,pos-600):pos+1800]))

              for cls in ('fshots', 'lshots'):
                  match = re.search(r'<[^>]+class=[\"\'][^\"\']*\b'+cls+r'\b[^\"\']*[\"\'][^>]*>', text, re.I)
                  print(f'CLASS_{cls.upper()}={match.start() if match else -1}')
                  if not match:
                      continue
                  start = match.start()
                  close = text.find('</div>', match.end())
                  block = text[start: close if close != -1 else start+300000]
                  print(clean(block)[:24000])
                  data_uris = re.findall(r'src=[\"\']data:image/([^;]+);base64,([^\"\']+)[\"\']', block, re.I)
                  print(f'{cls}_data_uri_count={len(data_uris)}')
                  for i,(kind,payload) in enumerate(data_uris[:3],1):
                      suffix='webp' if 'webp' in kind.lower() else ('png' if 'png' in kind.lower() else 'jpg')
                      out=Path(f'/tmp/{Path(path).stem}-{cls}-{i}.{suffix}')
                      out.write_bytes(base64.b64decode(payload))
                      print(f'EXTRACTED {out} bytes={out.stat().st_size}')

          inspect('apps.html')
          inspect('archive/apps-pre-restructure.html')
          PY

          echo '=== EXTRACTED IMAGE INFO ==='
          file /tmp/apps-* /tmp/apps-pre-restructure-* 2>/dev/null || true
