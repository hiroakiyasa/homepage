name: Inspect Apps Layout

on:
  push:
    paths:
      - '.github/workflows/inspect-apps-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect car screenshot layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def strip_images(value):
              return re.sub(r'(src=[\"\'])data:image/[^;]+;base64,[^\"\']+([\"\'])', r'\1[DATA_URI]\2', value, flags=re.I)

          def compact(value):
              return re.sub(r'\s+', ' ', strip_images(value)).strip()

          def print_rules(text, keywords):
              css = '\n'.join(re.findall(r'<style[^>]*>(.*?)</style>', text, re.I | re.S))
              seen = set()
              for match in re.finditer(r'([^{}]+)\{([^{}]*)\}', css, re.S):
                  selector = compact(match.group(1))
                  if re.search(keywords, selector, re.I):
                      rule = selector + '{' + compact(match.group(2)) + '}'
                      if rule not in seen:
                          seen.add(rule)
                          print(rule)

          apps = Path('apps.html').read_text(encoding='utf-8')
          print('=== APPS CSS ===')
          print_rules(apps, r'(ccshots|lead-app|#travel|flagship)')

          print('\n=== APPS CAR SECTION ===')
          idx = apps.find('class="ccshots')
          print(f'CCSHOTS_INDEX={idx}')
          if idx != -1:
              start = apps.rfind('<section', 0, idx)
              end = apps.find('</section>', idx)
              end = end + len('</section>') if end != -1 else idx + 16000
              print(compact(apps[start:end])[:22000])

          detail = Path('car-concierge.html').read_text(encoding='utf-8')
          print('\n=== DETAIL CSS ===')
          print_rules(detail, r'(shot|screen|phone|mock|gallery|preview)')

          print('\n=== DETAIL IMAGE REFERENCES ===')
          for filename in ('0dd51c79245df1297a-1400.webp', '7e3bda281bf4742c73-1400.webp', '21ca2b9879dce9c414-1400.webp'):
              idx = detail.find(filename)
              print(f'{filename}: {idx}')
              if idx != -1:
                  print(compact(detail[max(0, idx-1000):idx+2400]))
          PY

          echo '=== IMAGE FILE INFO ==='
          file assets/media/0dd51c79245df1297a-1400.webp || true
          file assets/media/7e3bda281bf4742c73-1400.webp || true
          file assets/media/21ca2b9879dce9c414-1400.webp || true
