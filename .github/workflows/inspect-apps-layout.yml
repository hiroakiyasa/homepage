name: Inspect Apps Layout

on:
  push:
    paths:
      - '.github/workflows/inspect-apps-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect Apps page layout rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps.html')
          text = path.read_text(encoding='utf-8')
          print(f'FILE_SIZE={len(text)}')

          def compact(value: str) -> str:
              value = re.sub(r'data:image/[^;\"\']+;base64,[^\"\']+', '[DATA_URI]', value)
              value = re.sub(r'\s+', ' ', value)
              return value.strip()

          print('\n=== EXTERNAL LINKS / SCRIPTS ===')
          for match in re.finditer(r'<(?:link|script)\b[^>]*(?:href|src)=[\"\'][^\"\']+[\"\'][^>]*>', text, re.I):
              print(compact(match.group(0)))

          print('\n=== CSS RULES CONTAINING ACARD / AVIS / SHOTS ===')
          head_end = text.lower().find('</head>')
          css_scope = text[:head_end if head_end != -1 else min(len(text), 300000)]
          seen = set()
          for match in re.finditer(r'([^{}]*(?:\.acard|\.avis|\.shots)[^{}]*)\{([^{}]*)\}', css_scope, re.I | re.S):
              rule = compact(match.group(1) + '{' + match.group(2) + '}')
              if rule not in seen:
                  seen.add(rule)
                  print(rule)

          print('\n=== CAR CONCIERGE MARKUP CONTEXT ===')
          idx = text.find('car-concierge.html')
          print(f'CAR_LINK_INDEX={idx}')
          if idx != -1:
              start = max(0, text.rfind('<article', 0, idx))
              end = text.find('</article>', idx)
              if end == -1:
                  end = idx + 5000
              else:
                  end += len('</article>')
              article = text[start:end]
              article = re.sub(r'(src=[\"\'])data:image/[^;]+;base64,[^\"\']+([\"\'])', r'\1[DATA_URI]\2', article)
              print(compact(article)[:12000])

          print('\n=== FIRST SHOTS MARKUP CONTEXT ===')
          idx = text.find('class="shots"')
          if idx == -1:
              idx = text.find("class='shots'")
          print(f'FIRST_SHOTS_INDEX={idx}')
          if idx != -1:
              chunk = text[max(0, idx - 500):idx + 5000]
              chunk = re.sub(r'(src=[\"\'])data:image/[^;]+;base64,[^\"\']+([\"\'])', r'\1[DATA_URI]\2', chunk)
              print(compact(chunk))
          PY
