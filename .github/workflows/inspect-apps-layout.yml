name: Inspect Apps Layout

on:
  push:
    paths:
      - '.github/workflows/inspect-apps-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate legacy flagship markup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('apps.html').read_text(encoding='utf-8')

          def clean(value):
              value = re.sub(r'data:image/[^;\"\']+;base64,[^\"\']+', '[DATA_URI]', value, flags=re.I)
              return re.sub(r'\s+', ' ', value).strip()

          terms = (
              'この物語から',
              'いちばん最初',
              'アプリの詳細を見る',
              'Google Play 近日公開',
              'FLAGSHIP',
              'flagship',
              'fshots',
              '車旅コンシェルジュ',
          )
          for term in terms:
              positions = [m.start() for m in re.finditer(re.escape(term), text, re.I)]
              print(f'\n=== {term}: {len(positions)} {positions[:20]} ===')
              for pos in positions[:8]:
                  before = max(
                      text.rfind('<section', 0, pos),
                      text.rfind('<article', 0, pos),
                      text.rfind('<div', 0, pos),
                  )
                  start = before if before >= 0 else max(0, pos-800)
                  print(f'-- AT {pos}, START {start} --')
                  print(clean(text[start:pos+5000])[:9000])

          print('\n=== CLASS ATTRIBUTES CONTAINING SHOT / FLAG / LEAD ===')
          seen=set()
          for match in re.finditer(r'class=[\"\']([^\"\']+)[\"\']', text, re.I):
              value=match.group(1)
              if re.search(r'(shot|flag|lead)', value, re.I) and value not in seen:
                  seen.add(value)
                  print(match.start(), value)
          PY
