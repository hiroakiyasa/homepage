name: Site redesign quality
on:
  push:
    branches: [feat/site-restructure-20260915]
    paths:
      - '.github/workflows/site-redesign-quality.yml'
      - 'scripts/site-redesign/**'
      - 'assets/css/site-v2.css'
      - 'assets/js/site-v2.js'
permissions:
  contents: write
concurrency:
  group: site-redesign-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install beautifulsoup4==4.13.4 pillow==11.3.0 playwright==1.55.0
      - name: Harden original layout and legal-language preservation
        run: python scripts/site-redesign/harden.py
      - name: Build redesigned static pages
        run: python scripts/site-redesign/build.py
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Validate links, metadata, layout and interactions
        run: python scripts/site-redesign/validate.py
      - name: Prepare review archive
        if: always()
        run: |
          mkdir -p /tmp/site-review/source
          if [ -d /tmp/site-redesign-results ]; then cp -R /tmp/site-redesign-results /tmp/site-review/; fi
          cp -R scripts/site-redesign /tmp/site-review/source/
          cp assets/css/site-v2.css /tmp/site-review/source/
          cp assets/js/site-v2.js /tmp/site-review/source/
          if [ -d assets/media ]; then cp -R assets/media /tmp/site-review/; fi
          if [ -d assets/og ]; then mkdir -p /tmp/site-review/og; cp assets/og/site-v2-* /tmp/site-review/og/ || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-redesign-review
          path: /tmp/site-review
          retention-days: 14
      - name: Commit validated generated pages to feature branch only
        if: success()
        run: |
          test "$GITHUB_REF_NAME" = 'feat/site-restructure-20260915'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: publish validated learning-first site with travel, DIY and maintenance hubs'
            git push origin HEAD:feat/site-restructure-20260915
          fi
