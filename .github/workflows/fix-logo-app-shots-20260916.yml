name: Restore original logo and app screenshot proportions

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/fix-logo-app-shots-20260916.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and verify repair
        shell: bash
        run: |
          git fetch --depth=1 origin b8c922f00f90f1e443b02253dd78d5f60b2de53d
          python scripts/apply_logo_appshot_fix.py
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site-v2.css assets/icons/trailfusion-lockup.webp
          git commit -m 'fix: restore original logo and normalize vehicle app screenshots on mobile'
          git pull --rebase origin master
          git push origin HEAD:master
