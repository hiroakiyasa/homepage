<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrailFusion AI</title>
<style>
  body{margin:0;background:#fffbf2;color:#1f2e4d;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
  .box{display:none;max-width:560px;background:#fff;border:3px solid #1f2e4d;border-radius:28px;box-shadow:8px 8px 0 #1f2e4d;padding:28px;text-align:center;margin:24px auto}
  body.error{display:grid;place-items:center;text-align:center;padding:24px}
  body.error .box{display:block}
  a{display:inline-flex;margin-top:16px;padding:14px 22px;border:3px solid #1f2e4d;border-radius:999px;background:#7dd87a;color:#1f2e4d;font-weight:900;text-decoration:none;box-shadow:5px 5px 0 #1f2e4d}
</style>
</head>
<body>
<div class="box" id="fallback"></div>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/hiroakiyasa/homepage/259bd788a76fcb0a81bbc361bbe70fcd8e2cc88b/index.html';
  const target=`          <a href="apps.html" class="btn-chunky btn-chunky-ocean text-sm md:text-base justify-center">
            <i class="ri-sparkling-2-fill text-xl"></i>
            <span>AIアプリを見る</span>
          </a>`;
  const maintenanceButton=target+`
          <a href="maintenance.html" class="btn-chunky text-sm md:text-base justify-center" style="background:#7DD87A;color:#1F2E4D;box-shadow:5px 5px 0 #1F2E4D;">
            <i class="ri-tools-fill text-xl"></i>
            <span>整備記録を見る</span>
          </a>`;
  const visitorCounterScript='<script src="assets/js/visitor-counter.js" defer></'+'script>';
  const removeHeroTripBadgeScript='<script>document.addEventListener("DOMContentLoaded",function(){document.querySelectorAll(".sticker").forEach(function(el){if((el.textContent||"").includes("実写の旅")){var p=el.closest(".float")||el.parentElement;if(p)p.remove();else el.remove();}});});</'+'script>';
  const renameAiAppLabelsScript='<script>document.addEventListener("DOMContentLoaded",function(){function walk(n){if(n.nodeType===3){n.nodeValue=n.nodeValue.replace(/AIアプリを見る/g,"開発したアプリを見る").replace(/AIアプリ/g,"開発したアプリ");return;}if(n.nodeType!==1||["SCRIPT","STYLE","NOSCRIPT","TEXTAREA"].includes(n.tagName))return;Array.from(n.childNodes).forEach(walk);}walk(document.body);});</'+'script>';
  const i18nScript='<script src="assets/js/i18n.js"></'+'script>';
  const oldNav=`      <nav class="hidden lg:flex items-center gap-6 xl:gap-8">
        <a href="index.html" class="nav-item text-navy" aria-current="page">ホーム</a>
        <a href="camping.html" class="nav-item text-navy">キャンピングカー</a>
        <a href="drive-routes/" class="nav-item text-navy">ドライブルート</a>
        <a href="apps.html" class="nav-item text-navy">AIアプリ</a>
        <a href="maintenance.html" class="nav-item text-navy">整備記録</a>
      </nav>`;
  const newNav=`      <nav class="hidden lg:flex items-center gap-6 xl:gap-8">
        <a href="index.html" class="nav-item text-navy" aria-current="page" data-i18n="nav.home">ホーム</a>
        <a href="camping.html" class="nav-item text-navy" data-i18n="nav.camping">キャンピングカー</a>
        <a href="drive-routes/" class="nav-item text-navy" data-i18n="nav.driveRoutes">ドライブルート</a>
        <a href="apps.html" class="nav-item text-navy" data-i18n="nav.apps">AIアプリ</a>
        <a href="maintenance.html" class="nav-item text-navy" data-i18n="nav.maintenance">整備記録</a>
      </nav>`;
  const oldActions=`      <!-- Actions -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Desktop CTA -->`;
  const newActions=`      <!-- Actions -->
      <div class="flex items-center gap-2 sm:gap-3">
        <div id="language-selector" class="hidden lg:block"></div>
        <div id="mobile-language-selector" class="lg:hidden"></div>
        <!-- Desktop CTA -->`;
  const oldTitle='<title>TrailFusion AI - 好きを力に、世界を旅する開発拠点</title>';
  const newTitle='<title data-i18n="meta.title">TrailFusion AI - 好きを力に、世界を旅する開発拠点</title>';
  const oldDesc='<meta name="description" content="キャンピングカーDIYとAIアプリケーション開発で「やりたいことを今やる」を叶えるTrailFusion AI。ハイエース改造から革新的AIアプリまで、挑戦する全ての人へ。">';
  const newDesc='<meta name="description" content="キャンピングカーDIYとAIアプリケーション開発で「やりたいことを今やる」を叶えるTrailFusion AI。ハイエース改造から革新的AIアプリまで、挑戦する全ての人へ。" data-i18n-content="meta.description">';
  const oldAiBlurb='実際の開発環境で磨いているBuddyTalk、VoiceLink、Word BlasterなどのAIアプリ。日常をちょっと便利に、もっと楽しく。';
  const newAiBlurb='<span data-i18n="home.aiBlurb">実際の開発環境で磨いているBuddyTalk、Reel Make、Wood Golem、Word BlasterなどのAIアプリ。日常をちょっと便利に、もっと楽しく。</span>';
  const oldFooterApps=`        <ul class="space-y-2 text-sm text-white/70">
          <li><a href="apps.html#buddytalk" class="hover:text-ocean transition">BuddyTalk</a></li>
          <li><a href="apps.html#wood-golem" class="hover:text-ocean transition">Wood Golem</a></li>
          <li><a href="apps.html#voicelink" class="hover:text-ocean transition">VoiceLink AI通訳</a></li>
          <li><a href="apps.html#word-blaster" class="hover:text-ocean transition">Word Blaster</a></li>
          <li><a href="apps.html#doc2json" class="hover:text-ocean transition">Doc2JSON AI</a></li>
        </ul>`;
  const newFooterApps=`        <ul class="space-y-2 text-sm text-white/70">
          <li><a href="reelmake.html" class="hover:text-ocean transition">Reel Make</a></li>
          <li><a href="buddytalk.html" class="hover:text-ocean transition">BuddyTalk</a></li>
          <li><a href="wood-golem.html" class="hover:text-ocean transition">Wood Golem</a></li>
          <li><a href="word-blaster.html" class="hover:text-ocean transition">Word Blaster</a></li>
          <li><a href="hacking-timer.html" class="hover:text-ocean transition">Hacking Timer</a></li>
          <li><a href="apps.html" class="hover:text-ocean transition">開発したアプリ一覧 →</a></li>
        </ul>`;
  try{
    let html=await fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()});
    html=html.replace(target,maintenanceButton);
    if(!html.includes('visitor-counter.js')){
      html=html.replace('</body>', visitorCounterScript+'</body>');
    }
    if(!html.includes('実写の旅')){
      html=html.replace('</body>', removeHeroTripBadgeScript+'</body>');
    } else {
      html=html.replace('</body>', removeHeroTripBadgeScript+'</body>');
    }
    html=html.replace('</body>', renameAiAppLabelsScript+'</body>');
    if(!html.includes('assets/js/i18n.js')){
      html=html.replace(oldTitle,newTitle);
      html=html.replace(oldDesc,newDesc);
      html=html.replace(oldNav,newNav);
      html=html.replace(oldActions,newActions);
      html=html.replace(oldAiBlurb,newAiBlurb);
      html=html.replace(oldFooterApps,newFooterApps);
      html=html.replace('</body>', i18nScript+'</body>');
    }
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.classList.add('error');
    document.getElementById('fallback').innerHTML='<h1>TrailFusion AI</h1><p>トップページの読み込みに失敗しました。</p><a href="maintenance.html">整備記録を見る</a>';
  }
})();
</script>
</body>
</html>
